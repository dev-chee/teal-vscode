name: Publish VS Code extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      toolchain_release:
        description: Complete stable toolchain Release in dev-chee/teal-vscode
        type: string
        default: latest
      publish:
        description: Publish to Marketplace (select a matching v* tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  toolchain:
    name: Select complete toolchain Release
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Resolve all 9 platform archives from one Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOLCHAIN_RELEASE: ${{ inputs.toolchain_release || 'latest' }}
        run: node scripts/verify-toolchain.mjs --resolve --release "$TOOLCHAIN_RELEASE"

  verify:
    name: Verify ${{ matrix.target }}
    needs: toolchain
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      DIST_TARGET: ${{ matrix.target }}
      TOOLCHAIN_RELEASE: ${{ needs.toolchain.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: matrix.extensionHost
        run: pnpm install --frozen-lockfile
      - name: Typecheck and lint
        if: matrix.extensionHost
        run: |
          pnpm run typecheck
          pnpm run lint
      - name: Unit tests
        if: matrix.extensionHost
        run: pnpm run test:unit
      - name: Download and verify platform toolchain
        if: matrix.extensionHost
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-toolchain.mjs --target ${{ matrix.target }} --release "${{ needs.toolchain.outputs.tag }}"
      - name: Real CLI, LSP and DAP protocol tests
        if: matrix.extensionHost
        run: pnpm run test:toolchain
      - name: VS Code extension host tests (Windows and macOS)
        if: matrix.extensionHost && runner.os != 'Linux'
        env:
          TEAL_TEST_GREP: cold-starts|recognizes generated|debug configurations|resolves tier|serves concrete LSP|integrated-terminal|runs a Teal file|attaches to
        run: pnpm test
      - name: VS Code extension host tests (Linux)
        if: matrix.extensionHost && runner.os == 'Linux'
        env:
          TEAL_TEST_GREP: cold-starts|recognizes generated|debug configurations|resolves tier|serves concrete LSP|integrated-terminal|runs a Teal file|attaches to
        run: xvfb-run --auto-servernum pnpm test

      - name: Managed updates and live LSP in VS Code
        if: matrix.extensionHost
        shell: bash
        env:
          TEAL_TEST_SUITE: toolchainUpdate.host.js
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run --auto-servernum pnpm test; else pnpm test; fi

      - name: Folder-specific toolchains in VS Code
        if: matrix.extensionHost
        shell: bash
        env:
          TEAL_TEST_SUITE: toolchainFolders.host.js
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run --auto-servernum pnpm test; else pnpm test; fi

      - name: Toolchain activation recovery in VS Code
        if: matrix.extensionHost
        shell: bash
        env:
          TEAL_TEST_SUITE: toolchainRecovery.host.js
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run --auto-servernum pnpm test; else pnpm test; fi

      - uses: docker/setup-qemu-action@v3
        if: matrix.target == 'linux-armhf'
        with:
          platforms: arm
      - name: Verify Alpine or ARMhf protocol execution
        if: ${{ !matrix.extensionHost }}
        shell: bash
        run: |
          set -euo pipefail
          image=node:22-alpine3.22
          platform=linux/amd64
          if [[ "$DIST_TARGET" == alpine-arm64 ]]; then platform=linux/arm64; fi
          if [[ "$DIST_TARGET" == linux-armhf ]]; then
            image=arm32v7/node:22-bookworm-slim
            platform=linux/arm/v7
          fi
          docker run --rm --platform "$platform" -v "$PWD:/work" -v /work/node_modules -w /work \
            -e DIST_TARGET -e TOOLCHAIN_RELEASE -e TEAL_TEST_TIMEOUT_MS=120000 "$image" sh -eu -c '
              if command -v apk >/dev/null; then apk add --no-cache tar gzip libstdc++; else apt-get update && apt-get install -y --no-install-recommends ca-certificates tar gzip; fi
              npm install --global pnpm@11
              pnpm install --frozen-lockfile
              pnpm run typecheck
              pnpm run lint
              pnpm run test:unit
              node scripts/verify-toolchain.mjs --target "$DIST_TARGET" --release "$TOOLCHAIN_RELEASE"
              export TEAL_TOOLCHAIN_PATH="$(cat target/toolchain-path.txt)"
              pnpm run test:toolchain
            '

  package:
    name: Package all desktop targets
    needs: [toolchain, verify]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package:all
      - uses: actions/upload-artifact@v4
        with:
          name: teal-vscode-${{ github.ref_name }}
          path: target/*.vsix
          if-no-files-found: error

  publish:
    name: Publish verified desktop packages
    if: github.event_name == 'push' || inputs.publish
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Check tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Publishing requires a v* tag matching package.json version.'
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: teal-vscode-${{ github.ref_name }}
          path: target
      - name: Publish every target (safe to retry partial publications)
        run: node scripts/publish.mjs
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
